name        = "personio-dayoff"
# version is rewritten by scripts/inject-manifest-version.sh at release time
# (called from .goreleaser.yml `before.hooks`). Leave at "0.0.0-dev" in source.
version     = "0.0.0-dev"
api_version = 1
description = "Liest Dayoff-/Abwesenheitstage aus der Personio-Frontend-API und stellt sie als Off-Hours-Intervalle bereit."
capabilities = ["off_hours_provider"]

[config_schema.fields.absence_type_filter]
label    = "Absence-Type Filter (kommagetrennt, leer = alle)"
type     = "text"
required = false

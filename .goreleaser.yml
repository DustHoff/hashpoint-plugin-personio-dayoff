version: 2

project_name: personio-dayoff

before:
  hooks:
    - go mod tidy
    - sh scripts/inject-manifest-version.sh {{ .Version }}

builds:
  - id: personio-dayoff
    binary: personio-dayoff
    main: ./
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -H=windowsgui
      - -X github.com/DustHoff/hashpoint-plugin-personio-dayoff/internal/plugin.pluginVersion={{ .Version }}

archives:
  - id: default
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Nest every archive entry inside a `personio-dayoff/` directory so
    # consumers (in particular the Hashpoint host's PluginManagement
    # handler, which installs into <PluginsDir>/<name>/) get a ready-to-drop
    # plugin folder when they extract the zip rather than loose files at
    # the archive root.
    wrap_in_directory: "{{ .ProjectName }}"
    files:
      - src: manifest.toml.versioned
        dst: manifest.toml
      - README.md
      - LICENSE*

checksum:
  algorithm: sha256
  # split: true emits one checksum file per release artifact instead of a
  # single aggregated checksums.txt — every download gets a matching
  # .sha256 sidecar that can be verified independently.
  split: true
  name_template: "{{ .ArtifactName }}.sha256"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

release:
  draft: false
  prerelease: auto
